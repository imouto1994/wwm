# GitHub Actions workflow to build and deploy the Boss Guide to GitHub Pages.
#
# Only the boss guide (apps/boss-guide) ships to GitHub Pages. The reforge
# app (apps/reforge) deploys separately via Vercel's Git integration.
#
# Triggered on push to main or manually via workflow_dispatch.
# Uses the modern actions/deploy-pages approach — no gh-pages branch needed,
# deploys directly from the build artifact.
#
# `pnpm build:boss` runs the boss guide's build:gh-pages script, which sets
# NEXT_PUBLIC_BASE_PATH=/wwm to:
# 1. Configure next.config.ts basePath for prefixed routing
# 2. Prefix <video> src paths in video-clip.tsx
# It outputs the static site to apps/boss-guide/out.
#
# Tina Cloud credentials are passed via GitHub Actions secrets so the
# TinaCMS client can query content at build time.
#
# Prerequisites:
# - Enable GitHub Pages in repo Settings → Pages → Source: GitHub Actions
# - Add these secrets in repo Settings → Secrets and variables → Actions:
#     NEXT_PUBLIC_TINA_CLIENT_ID  (from app.tina.io)
#     TINA_TOKEN                  (from app.tina.io)
# - Ensure .nvmrc specifies the correct Node.js version

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only redeploy the boss guide when it or shared workspace config changes.
    # Reforge-only changes (apps/reforge) deploy via Vercel instead.
    paths:
      - 'apps/boss-guide/**'
      - '.github/workflows/deploy.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments to avoid partial state
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      NEXT_PUBLIC_TINA_BRANCH: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build:boss

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/boss-guide/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
